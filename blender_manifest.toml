schema_version = "1.0.0"

id = "sourceio"
version = "5.7.2"
name = "SourceIO"
tagline = "Import GoldSrc, Source and Source 2 models, maps and textures"
maintainer = "REDxEYE"
type = "add-on"

website = "https://github.com/REDxEYE/SourceIO"

tags = ["Import-Export"]

blender_version_min = "5.2.0"

license = ["SPDX:MIT"]
copyright = ["2020 REDxEYE"]

# The bundled native pylib ships for these platforms only.
platforms = ["windows-x64", "linux-x64", "macos-x64", "macos-arm64"]

[permissions]
files = "Read game assets and write extracted texture caches"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/tests/",
  "/samples/",
  "/dist/",
  "/tools/",
  "/wiki/",
  "/plan.md",
  "/TODO.md",
  "*.pyi",
]
